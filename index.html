<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SentinelVision 哨兵视界 — 威胁情报聚合 · 态势感知 · 攻击溯源">
<title>SentinelVision · 哨兵视界 — 安全情报中心</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2300e5ff' stroke-width='2.5'/><circle cx='16' cy='16' r='5' fill='%2300e5ff'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-core"></div>
  <div class="boot-ring"></div>
  <div class="boot-text">SENTINEL VISION <span id="bootStatus">正在初始化情报网格…</span></div>
  <div class="boot-bar"><div id="bootBarFill"></div></div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand" id="navHome">
      <span class="brand-sigil">◎</span>
      <span class="brand-name">SENTINEL<b>VISION</b></span>
      <span class="brand-sub">哨兵视界 · 安全情报中心</span>
    </div>
    <nav class="nav" id="mainNav">
      <a href="#/dashboard" data-route="dashboard">态势大屏</a>
      <a href="#/intel" data-route="intel">情报流</a>
      <a href="#/graph" data-route="graph">威胁图谱</a>
      <a href="#/sources" data-route="sources" class="admin-link">情报源管理</a>
    </nav>
    <div class="topstats">
      <span class="ts-item"><span class="ts-dot ok"></span><span id="tsSources">0 源在线</span></span>
      <span class="ts-item"><span class="ts-dot warn"></span><span id="tsThreats">0 活跃威胁</span></span>
      <span class="ts-item ts-clock" id="tsClock">--:--:--</span>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="statusbar">
    <span class="sb-item"><span class="sb-led ok"></span> GRID <span class="sb-muted">ONLINE</span></span>
    <span class="sb-item" id="sbFeed">FEED · 待机</span>
    <span class="sb-item sb-right">本地演示数据 · 静态部署模式 · <a href="https://github.com/secpiano" target="_blank" rel="noopener">GitHub</a></span>
  </footer>
</div>

<script src="js/data.js"></script>
<script src="js/globe.js"></script>
<script src="js/charts.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
